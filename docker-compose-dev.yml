services:
  mysql:
    image: mysql:8.0
    container_name: timeto-mysql-dev
    restart: always
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysqlDevData:/var/lib/mysql
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    networks:
      - timetoDevNetwork

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeto-app-dev
    restart: always
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - "${APP_PORT}:8080"
    networks:
      - timetoDevNetwork

volumes:
  mysqlDevData:

networks:
  timetoDevNetwork:
    driver: bridge
